<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Emotion Lab — Juicy Life Problems Edition</title>
<style>
  body { background:#121212; color:#eee; font-family:Arial, sans-serif; margin:0; overflow:hidden; }
  #game { display:flex; height:100vh; }

  #shelf, #customer { width:30%; background:#1e1e1e; padding:20px; box-sizing:border-box; display:flex; flex-direction:column; }
  #center { flex:1; padding:20px; text-align:center; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; }

  h2 { margin-top:0; color:#ffeb3b; font-size: 20px; }

  .stats { display: flex; justify-content: space-between; background: #252525; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; font-size: 14px; border: 1px solid #333; }
  .stats span { color: #4caf50; }

  .emotion-shelf { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .emotion {
    width: 75px; height: 75px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: grab; font-weight: bold; font-size: 13px; text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    user-select: none;
  }
  .emotion:hover { transform: scale(1.08); box-shadow: 0 0 12px rgba(255,255,255,0.3); }
  .emotion:active { cursor: grabbing; }

  #joy { background:#ffd54f; color: #333; }
  #anger { background:#e53935; color: #fff; }
  #fear { background:#8e24aa; color:#fff; }
  #sadness { background:#42a5f5; color: #fff; }
  #calm { background:#66bb6a; color: #fff; }

  #bowl {
    width:220px; height:220px; border-radius:50%;
    background:#262626; border:4px dashed #555;
    margin: 10px auto; display: flex; align-items: center; justify-content: center;
    flex-direction: column; box-sizing:border-box; transition: all 0.3s;
  }
  #bowl.drag-over { border-color: #ffeb3b; background: #333; }

  #bowlList { margin: 10px 0; font-size: 14px; color: #aaa; font-style: italic; }

  #face { width:70px; height:70px; border-radius:50%; background:#555; margin:0 auto 10px auto; border: 2px solid #777; transition: background 0.3s; }

  #moodBar { width:100%; height:18px; background:#333; border-radius:9px; margin-bottom:15px; overflow:hidden; }
  #moodFill { height:100%; width:50%; background:#4caf50; border-radius:9px; transition: width 0.4s; }

  #log { margin-top:auto; height:180px; overflow-y:auto; background:#121212; padding:10px; border-radius:5px; font-size:13px; border: 1px solid #333; text-align: left; }
  .log-entry { border-bottom:1px solid #222; padding:8px 0; line-height: 1.4; }

  button {
    background:#4caf50; border:none; padding:10px 15px;
    margin:6px 0; border-radius:5px; cursor:pointer; color:white;
    font-size:14px; font-weight: bold; transition: background 0.2s;
  }
  button:hover { background: #43a047; }
  button:disabled { background:#444; color: #777; cursor:default; }
  
  .secondary-btn { background: #e53935; }
  .secondary-btn:hover { background: #d32f2f; }

  .problem-box { background: #252525; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #ffeb3b; font-size: 13px; line-height: 1.4; }
</style>
</head>
<body>

<div id="game">

  <!-- Emotion Shelf -->
  <div id="shelf">
    <h2>🧪 Emotion Shelf</h2>
    <p style="font-size: 12px; color: #aaa; margin-bottom: 15px;">Drag two emotions into the mix bowl to craft a potent life potion.</p>
    <div class="emotion-shelf">
      <div id="joy" class="emotion" draggable="true">Joy</div>
      <div id="anger" class="emotion" draggable="true">Anger</div>
      <div id="fear" class="emotion" draggable="true">Fear</div>
      <div id="sadness" class="emotion" draggable="true">Sadness</div>
      <div id="calm" class="emotion" draggable="true">Calm</div>
    </div>
  </div>

  <!-- Mix Bowl -->
  <div id="center">
    <h2>🥣 Mix Bowl</h2>
    <div id="bowl">Drop Emotions Here</div>
    <div id="bowlList">Empty</div>
    <button id="clearBowl" class="secondary-btn" style="padding: 6px 12px; font-size: 12px;">Clear Bowl</button>

    <p style="margin: 15px 0 5px 0;"><strong>Current Potion:</strong> <span id="mixResult" style="color: #ffeb3b;">None</span></p>
    <button id="deliverBtn" disabled>Give Potion to Customer</button>
  </div>

  <!-- Customer -->
  <div id="customer">
    <div class="stats">
      <div>Coins: <span id="coinCount">50</span> 🪙</div>
      <div>Satisfied: <span id="scoreCount">0</span> ✨</div>
    </div>

    <h2>👤 Customer Desk</h2>
    <div id="face"></div>
    <div id="moodBar"><div id="moodFill"></div></div>

    <div class="problem-box">
      <p style="margin:0 0 5px 0;"><strong>Vibe:</strong> <span id="personalityLabel">None</span></p>
      <p style="margin:0;"><strong>Dilemma:</strong> <span id="problem">None</span></p>
    </div>

    <button id="newCustomer">Next Customer</button>

    <div id="log"></div>
  </div>

</div>

<script>
// Emotion combos → potions
const combos = {
  "joy+anger": "righteous fury",
  "joy+fear": "nervous excitement",
  "anger+fear": "panic",
  "sadness+calm": "melancholy",
  "fear+calm": "unease",
  "joy+calm": "contentment",
  "anger+calm": "controlled aggression",
  "sadness+fear": "hopeless dread",
  "joy+sadness": "bittersweet"
};

let bowlContents = [];
let currentMix = null;
let customerProblem = null;
let customerPersonality = null;
let mood = 50;
let coins = 50;
let score = 0;

// ---------- LOG ----------
function log(msg) {
  const entry = document.createElement("div");
  entry.className = "log-entry";
  entry.innerHTML = msg;
  document.getElementById("log").prepend(entry);
}

// ---------- UPDATE STATS ----------
function updateStatsUI() {
  document.getElementById("coinCount").textContent = coins;
  document.getElementById("scoreCount").textContent = score;
}

// ---------- DRAG & DROP ----------
document.querySelectorAll(".emotion").forEach(e => {
  e.addEventListener("dragstart", ev => {
    ev.dataTransfer.setData("emotion", ev.target.id);
  });
});

const bowl = document.getElementById("bowl");

bowl.addEventListener("dragover", ev => {
  ev.preventDefault();
  bowl.classList.add("drag-over");
});

bowl.addEventListener("dragleave", () => {
  bowl.classList.remove("drag-over");
});

bowl.addEventListener("drop", ev => {
  ev.preventDefault();
  bowl.classList.remove("drag-over");
  
  if (bowlContents.length >= 2) return;

  const emotion = ev.dataTransfer.getData("emotion");
  if (!emotion) return;

  bowlContents.push(emotion.charAt(0).toUpperCase() + emotion.slice(1));
  document.getElementById("bowlList").textContent = bowlContents.join(" + ");

  if (bowlContents.length === 2) {
    const a = bowlContents[0].toLowerCase();
    const b = bowlContents[1].toLowerCase();

    const key1 = a + "+" + b;
    const key2 = b + "+" + a;

    currentMix = combos[key1] || combos[key2] || "unstable compound";
    document.getElementById("mixResult").textContent = currentMix;
    document.getElementById("deliverBtn").disabled = false;

    log(`✨ Crafted potion: <b>${currentMix}</b>`);
  }
});

// Clear bowl handler
document.getElementById("clearBowl").onclick = () => {
  bowlContents = [];
  currentMix = null;
  document.getElementById("bowlList").textContent = "Empty";
  document.getElementById("mixResult").textContent = "None";
  document.getElementById("deliverBtn").disabled = true;
};

// ---------- PROCEDURAL PROBLEM GENERATOR ----------
const problemTemplates = [
  "{person} did {badThing} and now I feel {emotion}.",
  "I'm stuck between {choiceA} and {choiceB}.",
  "I want to {action} but I'm scared it'll lead to {fearOutcome}.",
  "Someone I care about is acting {adjective} and I don't know why.",
  "{person} keeps crossing my boundaries and I'm not sure if I should {choiceA} or {choiceB}."
];

const problemParts = {
  person: ["my ex", "my boss", "my best friend", "my situationship", "my partner", "my roommate"],
  badThing: ["lied to me", "blocked me", "embarrassed me", "ignored me", "stole from me", "flirted with someone else"],
  emotion: ["furious", "heartbroken", "jealous", "confused", "numb", "petty"],
  choiceA: ["stay", "leave", "confront them", "ghost them", "forgive them", "start drama"],
  choiceB: ["move on", "cut them off", "pretend nothing happened", "keep quiet", "double text"],
  action: ["confess", "break up", "call them out", "apologize", "walk away", "start an argument"],
  fearOutcome: ["a huge fight", "losing them", "looking stupid", "regretting it", "making things worse", "everyone finding out"],
  adjective: ["distant", "weird", "secretive", "cold", "too friendly", "hot and cold"]
};

function generateProblem() {
  const template = problemTemplates[Math.floor(Math.random() * problemTemplates.length)];
  return template.replace(/\{(\w+)\}/g, (_, key) => {
    const list = problemParts[key];
    return list[Math.floor(Math.random() * list.length)];
  });
}

// ---------- PERSONALITY SYSTEM ----------
const personalities = [
  { type: "volatile", modifiers: { anger: +20, fear: +10 }, flavor: "Quick to react, bad at holding back." },
  { type: "anxious", modifiers: { fear: +25, calm: +10 }, flavor: "Overthinks everything, avoids conflict." },
  { type: "romantic", modifiers: { joy: +15, sadness: +10 }, flavor: "Feels everything deeply, especially love stuff." },
  { type: "stoic", modifiers: { calm: +20, anger: -10 }, flavor: "Keeps it together, rarely explodes." },
  { type: "dramatic", modifiers: { sadness: +20, joy: +10 }, flavor: "Lives for emotional plot twists." }
];

function generatePersonality() {
  return personalities[Math.floor(Math.random() * personalities.length)];
}

// ---------- NARRATIVE OUTCOME SYSTEM ----------
const outcomeTemplates = {
  "controlled aggression": [
    "They take a deep breath, steel themselves, and approach {person} to speak calmly but firmly about {issue}. Though the conversation gets tense, they hold their ground and walk away feeling {result}."
  ],
  "panic": [
    "Their heart races as worst-case scenarios take over. They entirely avoid {person} and frantically fire off a message they immediately regret, ending the day feeling {result}."
  ],
  "bittersweet": [
    "They find themselves drifting back to thoughts of {memory}. Tears well up, but they keep pushing forward, eventually writing a long message they decide never to send and feeling {result}."
  ],
  "contentment": [
    "Instead of running from their feelings, they sit with them and consciously choose not to start any drama today. They set a small, healthy boundary and stick to it, feeling {result} about the whole situation."
  ],
  "righteous fury": [
    "Fueled by a sudden surge of adrenaline, they storm straight toward {person} with all their emotions blazing. They lay out every detail of {issue} without holding back, leaving the scene feeling {result}."
  ],
  "melancholy": [
    "They loop memories of {memory} over and over in their mind, typing out a long explanation of how they feel. After hesitating, they hit send anyway, feeling {result} as they wait for a reply."
  ],
  "unease": [
    "They start second-guessing every tiny thing {person} does, assuming the worst about every delayed reply and stalking social media for hidden clues, leaving them feeling {result} and completely confused."
  ],
  "hopeless dread": [
    "They convince themselves this entire situation can only end in complete disaster, spiraling through worst-case scenarios and pushing {person} away before anything can actually happen, feeling {result}."
  ],
  "nervous excitement": [
    "Their heart races, but this time with a thrilling edge. They decide to take a risky emotional leap, sending a bold message and feeling {result}, unsure if it was a genius move or utter chaos."
  ],
  "unstable compound": [
    "The volatile potion reacts violently, causing their emotions to spike in every direction at once. They say things they absolutely shouldn't have said, leaving everything feeling {result} and vastly more complicated."
  ]
};

const storyParts = {
  person: ["their ex", "their boss", "their friend", "their crush", "their partner", "their roommate"],
  issue: ["the betrayal", "the argument", "the mixed signals", "the tension", "the boundary crossing"],
  memory: ["the good times", "the breakup", "the first date", "the fight", "the last call"],
  result: ["lighter", "worse", "uncertain", "strangely hopeful", "emotionally drained", "weirdly empowered"]
};

function generateOutcomeStory(potion) {
  const templates = outcomeTemplates[potion] || ["The potion causes unpredictable chaos, leaving them feeling {result}."];
  const template = templates[Math.floor(Math.random() * templates.length)];
  
  return template.replace(/\{(\w+)\}/g, (_, key) => {
    const list = storyParts[key];
    return list[Math.floor(Math.random() * list.length)];
  });
}

// ---------- CHAOS EVENTS ----------
const chaosEvents = [
  "A stray emotion leaks from the bowl and hits a random customer.",
  "Someone overhears the confrontation and jumps in with their own drama.",
  "The shop's atmosphere shifts—everyone gets a little more unstable.",
  "The potion amplifies a hidden feeling they didn't know they had."
];

function maybeChaos() {
  if (Math.random() < 0.25) {
    const event = chaosEvents[Math.floor(Math.random() * chaosEvents.length)];
    log(`⚠️ <b>Chaos Event:</b> ${event}`);
    mood -= 10;
    updateMood();
  }
}

// ---------- MOOD + FACE ----------
function updateMood() {
  mood = Math.max(0, Math.min(100, mood));
  document.getElementById("moodFill").style.width = mood + "%";

  const face = document.getElementById("face");
  if (mood > 70) face.style.background = "#4caf50";      // happy
  else if (mood > 30) face.style.background = "#ffc107"; // mixed
  else face.style.background = "#e53935";                // upset
}

// ---------- CUSTOMER SYSTEM ----------
function loadNewCustomer() {
  // Clear the previous customer's log history entirely
  document.getElementById("log").innerHTML = "";

  customerProblem = generateProblem();
  customerPersonality = generatePersonality();
  document.getElementById("problem").textContent = customerProblem;
  document.getElementById("personalityLabel").textContent =
    `${customerPersonality.type.toUpperCase()} — ${customerPersonality.flavor}`;

  mood = 50;
  updateMood();
  log(`🚪 <b>New customer arrived (${customerPersonality.type}):</b> "${customerProblem}"`);
}

document.getElementById("newCustomer").onclick = () => {
  loadNewCustomer();
};

document.getElementById("deliverBtn").onclick = () => {
  if (!currentMix || !customerProblem || !customerPersonality) return;

  // 1. Generate the narrative paragraph
  const storyParagraph = generateOutcomeStory(currentMix);
  log(`🧪 <b>Delivered ${currentMix}:</b> ${storyParagraph}`);

  // Calculate mood shift
  let delta = Math.floor(Math.random() * 40) - 10;

  const emotionInfluence = {
    "righteous fury": "anger",
    "panic": "fear",
    "nervous excitement": "fear",
    "melancholy": "sadness",
    "unease": "fear",
    "contentment": "calm",
    "controlled aggression": "anger",
    "hopeless dread": "sadness",
    "bittersweet": "sadness",
    "unstable compound": "anger"
  };

  const key = emotionInfluence[currentMix];
  if (key && customerPersonality.modifiers[key]) {
    delta += customerPersonality.modifiers[key];
  }

  if (currentMix === "unstable compound") {
    delta -= 40;
  }

  mood += delta;
  updateMood();

  // 2. Customer reaction & reward based on final mood
  if (mood >= 70) {
    coins += 25;
    score += 1;
    log("🎉 <b>Customer Reaction:</b> They feel remarkably better and leave completely satisfied! (+25 coins)");
  } else if (mood <= 20) {
    coins = Math.max(0, coins - 10);
    log("💢 <b>Customer Reaction:</b> The potion backfired horribly; they storm off furious! (-10 coins)");
  } else {
    coins += 10;
    log("😐 <b>Customer Reaction:</b> Their situation is a mixed bag, but they handle it okay. (+10 coins)");
  }
  updateStatsUI();

  // Chaos check
  maybeChaos();

  // Reset mix state
  bowlContents = [];
  currentMix = null;
  document.getElementById("bowlList").textContent = "Empty";
  document.getElementById("mixResult").textContent = "None";
  document.getElementById("deliverBtn").disabled = true;

  // Queue next customer after delay
  setTimeout(() => {
    loadNewCustomer();
  }, 5000);
};

// Initialize game on load
updateMood();
updateStatsUI();
loadNewCustomer();
</script>

</body>
</html>
